[project]
name = "saucepan-sdk"
version = "0.5.0"
description = "Standard-library Python client for the Saucepan central-store CLI"
readme = "README.md"
authors = [
    { name = "ZackaryW", email = "36378555+ZackaryW@users.noreply.github.com" }
]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "behave>=1.3.3",
    "pytest>=8.4.2",
    "pytest-testmon>=2.1.4",
]
