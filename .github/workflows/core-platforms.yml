name: Core platform checks

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform checks to run
        type: choice
        default: all
        options: [all, windows, macos, linux]
      check_msrv:
        description: Also check minimum Rust 1.89 on Windows
        type: boolean
        default: true
      check_keyring:
        description: Also verify native keyring custody on configured hosts
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        type: string
        default: ''
      check_keyring:
        description: Require native keyring integration in addition to ordinary checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Reusable release calls have no platform input and always select all.
        os: ${{ fromJSON('{"all":["windows-latest","macos-latest","ubuntu-latest"],"windows":["windows-latest"],"macos":["macos-latest"],"linux":["ubuntu-latest"]}')[inputs.platform || 'all'] }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux Git LFS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-lfs
      - name: Install optional Linux credential service
        if: runner.os == 'Linux' && inputs.check_keyring
        run: sudo apt-get install -y gnome-keyring dbus-x11
      - name: Verify Git LFS prerequisite
        run: git lfs version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python -B -m unittest discover -s scripts -p test_release.py
      - name: Ordinary tests without native key custody
        shell: bash
        run: cargo test --locked --all-targets -- --nocapture
      - name: Native keyring checks not requested
        if: ${{ !inputs.check_keyring }}
        shell: bash
        run: echo "Native keyring verification was not requested; basic tests do not verify native custody." >> "$GITHUB_STEP_SUMMARY"
      - name: Optional Windows and macOS native key custody
        if: runner.os != 'Linux' && inputs.check_keyring
        timeout-minutes: 10
        shell: bash
        run: |
          cargo test --locked --test native_keys -- --ignored --nocapture
          cargo test --locked --test metadata_integrity native_keyring_round_trip_and_cleanup -- --ignored --exact --nocapture
      - name: Optional Linux native custody with isolated Secret Service
        if: runner.os == 'Linux' && inputs.check_keyring
        timeout-minutes: 10
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "saucepan-ci-only" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --test native_keys -- --ignored --nocapture
            cargo test --locked --test metadata_integrity native_keyring_round_trip_and_cleanup -- --ignored --exact --nocapture
          '

  msrv:
    name: Minimum Rust 1.89 (Windows)
    # Use input presence, not event_name: manual releases are also dispatches.
    if: ${{ !inputs.platform || inputs.check_msrv }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --all-targets
